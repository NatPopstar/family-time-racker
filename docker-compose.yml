# Описание того, какие контейнеры поднимать и как их соединять.
# Запуск:    docker compose up
# Остановка: docker compose down

services:
  app:
    build: .
    container_name: ftt-app

    ports:
      # "снаружи:внутри" — открыв localhost:5180 в браузере,
      # ты попадёшь на порт 5173 внутри контейнера.
      # Снаружи взят 5180, потому что 5173 уже занят проектом body-tracker.
      - '5180:5173'

    volumes:
      # 1) Исходный код. Точка — это папка проекта на диске D:.
      #    Правишь файл в редакторе — контейнер видит изменение мгновенно.
      - .:/app

      # 2) ГЛАВНЫЙ ТРЮК. Этот том «накрывает» папку /app/node_modules сверху,
      #    поэтому зависимости живут внутри Docker на быстром диске,
      #    а не на медленном внешнем USB-диске D:.
      #    Именно из-за этого установка пакетов перестаёт зависать.
      - node_modules:/app/node_modules

    environment:
      # Docker на Windows не всегда сообщает контейнеру об изменении файлов.
      # Эта переменная просит следилку опрашивать файлы самой,
      # иначе страница не будет автоматически обновляться при правке кода.
      - CHOKIDAR_USEPOLLING=true

    # Держит контейнер «живым», если что-то пойдёт не так при отладке.
    stdin_open: true
    tty: true

volumes:
  # Именованный том. Docker создаёт и хранит его сам;
  # он переживает перезапуск и удаление контейнера.
  node_modules:
